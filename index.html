    <div class="divider">または、食材を入力</div>

  return Object.hasOwn(ingredientAliases,name)?ingredientAliases[name]:name;
}

let items=[];try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(saved))items=saved.filter(x=>typeof x==='string')}catch{}

const mealVegetables={
  'キャベツ':'ざく切り','白菜':'ざく切り','玉ねぎ':'薄切り','長ねぎ':'斜め薄切り',
  'にんじん':'細切り','じゃがいも':'5mm厚さのいちょう切り','さつまいも':'5mm厚さのいちょう切り',
  '大根':'5mm厚さのいちょう切り','トマト':'一口大','なす':'薄めの半月切り',
  'ピーマン':'細切り','パプリカ':'細切り','小松菜':'3cm幅','ほうれん草':'3cm幅',
  'ブロッコリー':'小さめの房','もやし':'水気を切る','ズッキーニ':'薄い半月切り',
  'かぼちゃ':'5mm厚さの薄切り','きのこ':'一口大','しめじ':'小房','しいたけ':'薄切り',
  'エリンギ':'薄切り','舞茸':'小房','まいたけ':'小房','えのき':'3cm幅','マッシュルーム':'薄切り',
  'ひらたけ':'小房','レタス':'一口大','コーン':'汁気を切る'
};
const firmVegetables=['にんじん','じゃがいも','さつまいも','大根','かぼちゃ','ブロッコリー'];
const mealProteins=['鶏むね肉','鶏もも肉','豚こま肉','豚バラ肉','牛こま肉','ひき肉','鶏肉','豚肉','牛肉'];
const meatSafety='肉は中心まで十分に加熱する（中心温度75℃で1分以上が目安）。';

function mealIdeas(available){
  const foods=[...available];
  const vegetables=foods.filter(name=>Object.hasOwn(mealVegetables,name)
    &&(name!=='きのこ'||!mushrooms.some(kind=>available.has(kind)))).slice(0,3);
  const meat=foods.find(name=>mealProteins.includes(name));
  const protein=meat||foods.find(name=>name==='豆腐'||name==='ツナ');
  const hasEgg=available.has('卵');
  const ideas=[];
  const prepVegetables=names=>names.map(name=>{
    const cut=mealVegetables[name];
    return name+'は'+(cut.endsWith('切る')?cut:cut+'にする')+'。';
  }).join(' ');
  const meatPrep=meat?(meat==='ひき肉'?'ひき肉をほぐす。':meat+'を小さめの一口大に切る。'):'';
  const prepare=(main)=>[
    prepVegetables(vegetables),meatPrep,
    main==='豆腐'?'豆腐は水気を切って一口大に切る。':'',
    main==='ツナ'?'ツナは汁気を切る。':''
  ].filter(Boolean).join(' ');
  const amount=name=>name==='ツナ'?'1/2缶':name==='豆腐'?'100g':mealProteins.includes(name)?'100g':'約50g';
  const vegetablesForPan=vegetables.length
    ?(vegetables.some(name=>firmVegetables.includes(name))
      ?'火の通りにくい野菜から炒め、水大さじ1を加えてふたをし、柔らかくなるまで蒸し焼きにする。残りの野菜を加えて火を通す。'
      :'野菜を加えて火が通るまで炒める。')
    :'';
  const selected=[...(protein?[protein]:[]),...vegetables];
  const label=names=>names.slice(0,2).join('と')+(names.length>2?'など':'');
  if(selected.length){
    const start=meat?'フライパンに油を熱し、肉を炒める。':'フライパンに油を熱する。';
    const finish=protein==='豆腐'?'豆腐を加え、崩さないように温まるまで炒める。'
      :protein==='ツナ'?'ツナを加え、全体を混ぜて温める。':'';
    ideas.push({
      name:label(selected)+'のしょうゆ炒め',time:meat||vegetables.some(name=>firmVegetables.includes(name))?20:10,
      ingredients:selected.map(name=>name+' '+amount(name)),seasoning:'油 小さじ1、しょうゆ 小さじ1、こしょう 少々',
      steps:[prepare(protein),[start,vegetablesForPan,finish,meat?meatSafety:''].filter(Boolean).join(' '),'しょうゆを回し入れ、こしょうで味を調える。']
    });
    const simmer=meat?'肉は先に入れ、再沸騰したらアクを取る。':'';
    const addVegetables=vegetables.length?'野菜は火の通りにくいものから加え、柔らかくなるまで煮る。':'';
    const addProtein=protein&&!meat?protein+'を加えて温まるまで煮る。':'';
    ideas.push({
      name:label(selected)+'のうま塩スープ',time:meat?25:vegetables.some(name=>firmVegetables.includes(name))?20:15,
      ingredients:selected.map(name=>name+' '+amount(name)),seasoning:'水 250mL、顆粒だし 小さじ1/2、塩・こしょう 各少々',
      steps:[prepare(protein),'鍋に水とだしを入れて沸かす。',[simmer,addVegetables,addProtein,meat?meatSafety:'','塩・こしょうで味を調える。'].filter(Boolean).join(' ')]
    });
  }
  if(hasEgg){
    const eggFilling=vegetables.slice(0,2);
    const eggAmount=eggFilling.map(name=>name+' '+amount(name));
    ideas.unshift({
      name:eggFilling.length?eggFilling.join('と')+'の卵炒め':'ふんわり炒り卵',time:eggFilling.some(name=>firmVegetables.includes(name))?15:10,
      ingredients:['卵 2個',...eggAmount],seasoning:'油 小さじ1、塩・こしょう 各少々',
      steps:[prepVegetables(eggFilling),'卵を溶き、塩・こしょうを混ぜる。',
        'フライパンに油を熱する。'+(eggFilling.length?'具を火の通りにくいものから炒め、柔らかくする。':''),
        '溶き卵を入れ、大きく混ぜながら全体が固まるまで火を通す。']
    });
  }
  return ideas;
}

function renderMealIdeas(available){
  const container=$('#mealIdeas');
  container.replaceChildren();
  const ideas=mealIdeas(available);
  $('#mealIdeaCount').textContent=ideas.length?ideas.length+' 件':'';
  const message=$('#mealIdeaEmpty');
  message.hidden=ideas.length>0;
  message.textContent=available.size
    ?'卵・豆腐・野菜・肉など、対応する食材を追加すると作り方が出ます。'
    :'食材を追加すると、組み合わせに合う作り方が出ます。';
  for(const recipe of ideas){
    const details=document.createElement('details');
    details.className='meal-idea';
    details.innerHTML=`<summary><strong>${recipe.name}</strong><span>約${recipe.time}分</span></summary>
      <div class="meal-idea-body">
        <h3>材料（1人分）</h3><p>${recipe.ingredients.join('、')}</p>
        <p><b>調味料</b> ${recipe.seasoning}</p>
        <h3>作り方</h3><ol>${recipe.steps.filter(Boolean).map(step=>'<li>'+step+'</li>').join('')}</ol>
      </div>`;
    container.append(details);
  }
}

function render(){
  const box=$('#ingredients');
  box.innerHTML='';
  items.forEach((name,index)=>{
    const chip=document.createElement('span');
    chip.className='chip';
    chip.append(document.createTextNode(name+' '));
    const remove=document.createElement('button');
    remove.textContent='×';
    remove.setAttribute('aria-label',name+'を削除');
    remove.onclick=()=>{
      items.splice(index,1);
      saveIngredients();
      render();
    };
    chip.append(remove);
    box.append(chip);
  });
  $('#count').textContent=items.length+' 品';
  $('#empty').hidden=items.length>0;
  $('#demoNote').hidden=!window.demoItems;

  const available=new Set(items.map(ingredientName));
  if(mushrooms.some(name=>available.has(name)))available.add('きのこ');
  renderMealIdeas(available);
  let matching=recipes.filter(recipe=>recipe.need.every(name=>available.has(name)));
  if(filter==='15')matching=matching.filter(recipe=>recipe.time<=15);
  if(filter==='easy')matching=matching.filter(recipe=>recipe.easy);
  if(filter==='vegetarian')matching=matching.filter(recipe=>recipe.vegetarian);
  matching.sort((a,b)=>b.need.length-a.need.length);

  const list=$('#recipes');
  list.innerHTML='';
  matching.forEach(recipe=>{
    const card=document.createElement('article');
    card.className='recipe';
    const other=recipe.extra.split('・').filter(name=>!available.has(ingredientName(name)));
    const href=recipe.url;
    card.innerHTML=`<div class="food" aria-hidden="true"><span>${recipe.emoji}</span></div><div>
      <h3>${recipe.name}</h3>
      <p class="recipe-ingredients">${recipe.need.join('・')}</p>
      ${other.length?`<p>ほかに ${other.join('・')}</p>`:''}
      <div class="meta">◷ 約${recipe.time}分${recipe.easy?' <span>·</span> かんたん':''}</div>
      <a class="recipe-source" href="${href}" target="_blank" rel="noopener noreferrer">${recipe.related?'似たレシピを見る':'作り方を見る'} ↗ <span>${recipe.source}</span></a>
    </div>`;
    if(recipe.image){
      const image=document.createElement('img');
      image.alt='';
      image.loading='lazy';
      image.decoding='async';
      image.referrerPolicy='no-referrer';
      image.addEventListener('error',()=>image.remove());
      image.src=recipe.image.url;
      card.querySelector('.food').append(image);
      const credit=document.createElement('small');
      credit.className='photo-credit';
      const file='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(recipe.image.file);
      credit.innerHTML=`参考写真 <a href="${file}" target="_blank" rel="noopener noreferrer">${recipe.image.author}</a> · <a href="${recipe.image.licenseUrl}" target="_blank" rel="noopener noreferrer">${recipe.image.license}</a>`;
      card.lastElementChild.append(credit);
    }
    list.append(card);
  });
  $('#recipeCount').textContent=items.length?matching.length+' 件':'まずは食材を追加';
  const empty=$('#noRecipes');
  empty.style.display=matching.length?'none':'block';
  empty.textContent=items.length
    ? '主な食材がそろうレシピが見つかりませんでした。'
    : '食材を追加すると、作れるレシピが表示されます。';
}

function add(list){
  let added=0;
  for(const name of list.map(value=>value.trim()).filter(Boolean)){
    if(items.some(value=>ingredientName(value).toLowerCase()===ingredientName(name).toLowerCase()))continue;
    items.push(name);
    added++;
  }
  if(added)saveIngredients();
  render();
  return added;
}

function setCloudStatus(title,subtitle,button){$('#cloudTitle').textContent=title;$('#cloudSubtitle').textContent=subtitle;$('#cloudToggle').textContent=button}
function showCloudHelp(message){const el=$('#cloudHelp');el.textContent=message;el.classList.add('show')}
function pendingKey(user){
  return STORAGE_KEY+'-pending-'+user.id;
}

function saveIngredients(){
  const snapshot=JSON.stringify(items);
  localStorage.setItem(STORAGE_KEY,snapshot);
  if(!cloudUser){
    if(cloudClient&&!cloudSessionKnown)editedBeforeSession=true;
    return;
  }

  localStorage.setItem(pendingKey(cloudUser),snapshot);
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(syncCloud,500);
}

function syncCloud(){
  const user=cloudUser;
  if(!cloudClient||!user)return;
  // Serialize cloud requests so older saves cannot finish after newer ones.
  cloudQueue=cloudQueue.then(()=>syncIngredients(user));
  return cloudQueue;
}

async function syncIngredients(user){
  if(cloudUser?.id!==user.id)return;
  const email=user.email||'ログイン済み';
  const key=pendingKey(user);

  try{
    const pending=localStorage.getItem(key);
    if(pending!==null){
      const ingredients=JSON.parse(pending);
      if(JSON.stringify(items)!==pending){
        items=ingredients;
        localStorage.setItem(STORAGE_KEY,pending);
        render();
      }
      await saveCloud(user,ingredients);
      if(cloudUser?.id!==user.id)return;
      // An edit made while saving is still waiting for its own save.
      if(localStorage.getItem(key)===pending)localStorage.removeItem(key);
    }else{
      setCloudStatus('クラウドと同期中…',email,'同期中');
      const {data,error}=await cloudClient.from('fridge_lists').select('ingredients').eq('user_id',user.id).maybeSingle();
      if(cloudUser?.id!==user.id||localStorage.getItem(key)!==null)return;
      if(error)throw error;
      if(data&&Array.isArray(data.ingredients)){
        items=data.ingredients.filter(value=>typeof value==='string');
        localStorage.setItem(STORAGE_KEY,JSON.stringify(items));
        render();
      }else{
        await saveCloud(user,[...items]);
      }
    }
    if(cloudUser?.id===user.id)setCloudStatus('スマホ・PCで同期中',email,'ログアウト');
  }catch{
    if(cloudUser?.id!==user.id)return;
    showCloudHelp('同期に失敗しました。ネット接続とSupabaseの設定を確認してください。');
    setCloudStatus('端末に保存中','クラウドに接続できません','再試行');
  }
}

async function saveCloud(user,ingredients){
  setCloudStatus('クラウドに保存中…',user.email||'ログイン済み','同期中');
  const {error}=await cloudClient.from('fridge_lists').upsert({
    user_id:user.id,
    ingredients,
    updated_at:new Date().toISOString()
  },{onConflict:'user_id'});
  if(error)throw error;
}
$('#cloudToggle').onclick=async()=>{if(!cloudClient){showCloudHelp('クラウド接続の準備がまだです。付属の「はじめかた.md」に沿ってSupabaseのURLと公開キーを設定してください。');return}if(cloudUser){if($('#cloudToggle').textContent==='再試行'){syncCloud();return}clearTimeout(cloudTimer);await cloudClient.auth.signOut();cloudUser=null;setCloudStatus('端末間で食材を同期','メールでログインすると、スマホとPCで共有できます','ログイン');$('#cloudForm').classList.remove('open');return}$('#cloudForm').classList.toggle('open')};
$('#cloudForm').onsubmit=async e=>{e.preventDefault();if(!cloudClient){showCloudHelp('先にSupabaseの接続設定が必要です。付属の「はじめかた.md」をご覧ください。');return}const email=$('#cloudEmail').value.trim();const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error){showCloudHelp('ログインメールを送れませんでした。設定とメールアドレスを確認してください。');return}showCloudHelp('ログイン用リンクをメールで送りました。リンクを開くと、この端末と他の端末で食材リストを同期します。');$('#cloudForm').classList.remove('open')};
function updateCloudSession(session){
  cloudUser=session?.user||null;
  cloudSessionKnown=true;
  if(cloudUser){
    if(editedBeforeSession)saveIngredients();
    syncCloud();
  }else{
    setCloudStatus('端末間で食材を同期','メールでログインすると、スマホとPCで共有できます','ログイン');
  }
  editedBeforeSession=false;
}
if(cloudClient){
  cloudClient.auth.getSession().then(({data})=>updateCloudSession(data.session));
  cloudClient.auth.onAuthStateChange((_event,session)=>updateCloudSession(session));
  window.addEventListener('focus',syncCloud);
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')syncCloud();
  });
}else{
  setCloudStatus('端末間で食材を同期','接続設定後、スマホとPCで共有できます','設定方法');
}
