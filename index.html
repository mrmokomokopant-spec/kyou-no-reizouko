<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6ef">
  <title>冷蔵庫から、今日なに作る？</title>
  <style>
    :root{--ink:#24291f;--muted:#777b70;--green:#456c4c;--lime:#d9e7c9;--cream:#f6f6ef;--paper:#fffefa;--line:#e8e8dc;--orange:#f1aa65;--shadow:0 16px 44px #28372210}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer} .app{max-width:480px;min-height:100svh;margin:auto;background:var(--cream);padding:0 20px 104px;position:relative;overflow:hidden}
    .top{height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:14px;font-weight:750;letter-spacing:.02em;display:flex;align-items:center;gap:8px}.brandmark{width:28px;height:28px;border-radius:10px;background:var(--green);color:white;display:grid;place-items:center;font-size:15px}.avatar{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:#fff;display:grid;place-items:center;font-size:17px}
    .hero{padding:19px 0 22px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--green);text-transform:uppercase}.hero h1{font-size:30px;line-height:1.42;letter-spacing:-.055em;margin:7px 0 7px;font-weight:760}.hero h1 em{font-style:normal;color:var(--green)}.hero p{margin:0;font-size:13px;color:var(--muted);line-height:1.8}
    .upload-card{background:var(--paper);border:1px solid #eaeade;border-radius:22px;padding:16px;box-shadow:var(--shadow)}.tabs{display:flex;gap:7px;background:#f1f2e9;padding:4px;border-radius:12px;margin-bottom:14px}.tab{flex:1;border:0;border-radius:9px;background:transparent;padding:9px 8px;color:var(--muted);font-size:12px;font-weight:650}.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px #29362212}.drop{border:1.5px dashed #c9d5c1;background:#f7f9f2;border-radius:16px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.drop-content{padding:17px 10px}.camera{width:38px;height:38px;border-radius:13px;background:#e7efdf;margin:0 auto 8px;display:grid;place-items:center;font-size:19px}.drop strong{font-size:13px;display:block}.drop small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.preview{display:none;width:100%;height:160px;object-fit:cover}.drop.has-image .preview{display:block}.drop.has-image .drop-content{position:absolute;bottom:8px;left:8px;background:#fffffff0;border-radius:10px;padding:8px 12px}.drop.has-image .camera,.drop.has-image small{display:none}.drop.has-image strong{font-size:11px}
    .privacy{font-size:10px;color:#8a8d83;margin:10px 0 14px;display:flex;gap:6px;align-items:center}.primary{width:100%;border:0;border-radius:13px;padding:14px 16px;color:white;background:var(--green);font-size:14px;font-weight:700;letter-spacing:.02em;box-shadow:0 5px 12px #456c4c24}.primary:active{transform:scale(.99)}.primary:disabled{opacity:.6}.divider{display:flex;align-items:center;gap:10px;color:#a0a297;font-size:10px;margin:13px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.manual{display:flex;gap:8px}.manual input{min-width:0;flex:1;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;font-size:12px;outline:none}.manual input:focus{border-color:#91aa8c}.add{border:1px solid #dfe5d8;background:white;border-radius:12px;padding:0 14px;color:var(--green);font-size:12px;font-weight:700}
    .section-head{display:flex;justify-content:space-between;align-items:end;margin:27px 0 12px}.section-head h2{margin:0;font-size:17px;letter-spacing:-.03em}.section-head span{color:var(--muted);font-size:11px}.ingredients{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:99px;padding:8px 11px;background:#edf2e6;color:#344c34;font-size:12px;border:1px solid #e1ead9;display:flex;gap:6px;align-items:center}.chip button{border:0;background:none;padding:0;color:#82917d;font-size:14px;line-height:1}.empty{padding:19px;border:1px dashed #d7dacd;border-radius:15px;color:#898c82;font-size:12px;text-align:center;line-height:1.8}.demo-note{font-size:10px;color:#8c8e85;margin-top:8px;line-height:1.6}
    .filters{display:flex;gap:7px;overflow:auto;padding:0 1px 3px;scrollbar-width:none}.filter{white-space:nowrap;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:11px;color:#63695e}.filter.active{background:#354d38;color:white;border-color:#354d38}.recipes{display:grid;gap:10px}.recipe{background:var(--paper);border:1px solid #ebebdf;border-radius:17px;padding:13px;display:grid;grid-template-columns:67px 1fr;gap:12px;box-shadow:0 5px 18px #28372208}.food{width:67px;height:72px;border-radius:13px;display:grid;place-items:center;font-size:32px;background:#f0eddf}.recipe h3{font-size:14px;margin:2px 0 5px}.recipe p{font-size:10px;color:var(--muted);margin:0 0 8px;line-height:1.5}.meta{display:flex;align-items:center;gap:7px;font-size:10px;color:#777b70}.match{margin-left:auto;background:#edf2e6;color:#456c4c;padding:4px 7px;border-radius:99px;font-weight:700}.recipe[hidden]{display:none}.no-recipes{padding:18px;text-align:center;color:var(--muted);font-size:12px;display:none}
    .bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:calc(66px + env(safe-area-inset-bottom));padding:8px 24px env(safe-area-inset-bottom);background:#fffefaed;backdrop-filter:blur(12px);border-top:1px solid #e8e8dc;display:flex;justify-content:space-around;z-index:3}.nav{border:0;background:none;color:#97998f;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:9px}.nav b{font-size:18px;font-weight:400}.nav.active{color:var(--green)}
    .toast{position:fixed;bottom:82px;left:50%;transform:translate(-50%,12px);opacity:0;transition:.2s;background:#273729;color:white;padding:10px 15px;border-radius:99px;font-size:12px;pointer-events:none;z-index:5;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
    .cloud-card{background:#edf2e6;border:1px solid #dfe8d8;border-radius:16px;padding:13px 14px;margin:0 0 17px}.cloud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}.cloud-copy strong{display:block;font-size:12px}.cloud-copy span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.cloud-action{border:1px solid #d2dfc9;border-radius:10px;background:#fff;padding:8px 11px;color:var(--green);font-size:11px;font-weight:700;white-space:nowrap}.cloud-form{display:none;margin-top:11px}.cloud-form.open{display:flex;gap:7px}.cloud-form input{flex:1;min-width:0;border:1px solid #dce3d5;border-radius:10px;padding:10px;background:#fff;font-size:12px}.cloud-help{display:none;color:#7a7e72;font-size:10px;line-height:1.6;margin:9px 0 0}.cloud-help.show{display:block}
    @media(min-width:700px){body{padding:25px 0}.app{border-radius:28px;box-shadow:0 20px 70px #1f2b1a15;min-height:calc(100svh - 50px)}.bottom{bottom:25px;border-radius:0 0 28px 28px}}
  </style>
</head>
<body><main class="app">
  <header class="top"><div class="brand"><span class="brandmark">菜</span>きょうの冷蔵庫</div><div class="avatar">☺</div></header>
  <section class="hero"><div class="eyebrow">YOUR FRIDGE, YOUR MENU</div><h1>冷蔵庫から、<br><em>今日なに作る？</em></h1><p>写真を撮るだけ。あるもので作れるごはん、見つけよう。</p></section>
  <section class="cloud-card"><div class="cloud-row"><div class="cloud-copy"><strong id="cloudTitle">端末間で食材を同期</strong><span id="cloudSubtitle">メールでログインすると、スマホとPCで共有できます</span></div><button class="cloud-action" id="cloudToggle">ログイン</button></div><form class="cloud-form" id="cloudForm"><input id="cloudEmail" type="email" autocomplete="email" placeholder="メールアドレス" required><button class="cloud-action" type="submit">ログインリンクを送る</button></form><p class="cloud-help" id="cloudHelp"></p></section>
  <section class="upload-card" aria-label="食材の取り込み">
    <div class="tabs"><button class="tab active" data-kind="fridge">📷 冷蔵庫を撮る</button><button class="tab" data-kind="receipt">🧾 レシートを撮る</button></div>
    <label class="drop" id="drop"><img class="preview" id="preview" alt="選択した写真"><div class="drop-content"><div class="camera" id="camera">＋</div><strong id="uploadTitle">写真を撮る・選ぶ</strong><small id="uploadHint">冷蔵庫の中が見える写真をアップロード</small></div><input id="photo" type="file" accept="image/*" capture="environment" aria-label="写真を撮るまたは画像を選ぶ"></label>
    <div class="privacy">🔒 写真は食材の確認にだけ使います</div>
    <button class="primary" id="scan">写真から食材を読み取る <span>→</span></button>
    <div class="divider">または、食材を入力</div>
    <form class="manual" id="manual"><input id="ingredientInput" placeholder="例：卵、キャベツ" aria-label="食材を入力"><button class="add">追加 ＋</button></form>
  </section>
  <section><div class="section-head"><h2>冷蔵庫の中身</h2><span id="count">0 品</span></div><div class="ingredients" id="ingredients"></div><div class="empty" id="empty">写真から読み取るか、食材を入力すると<br>ここに食材が並びます。</div><div class="demo-note" id="demoNote" hidden>写真認識はデモ表示です。実際の食材と違う場合は、チップを編集してください。</div></section>
  <section><div class="section-head"><h2>この食材で作れるもの</h2><span id="recipeCount">まずは食材を追加</span></div><div class="filters"><button class="filter active" data-filter="all">おすすめ</button><button class="filter" data-filter="15">15分以内</button><button class="filter" data-filter="easy">かんたん</button><button class="filter" data-filter="vegetarian">野菜多め</button></div><div class="recipes" id="recipes"></div><div class="no-recipes" id="noRecipes">食材を2つ以上追加すると、レシピが見つかります。</div></section>
</main><nav class="bottom"><button class="nav active"><b>⌂</b>ホーム</button><button class="nav"><b>♡</b>お気に入り</button><button class="nav"><b>◷</b>履歴</button><button class="nav"><b>☻</b>マイページ</button></nav><div class="toast" id="toast"></div>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const recipes=[
 {name:'ふんわり卵とじ丼',emoji:'🍚',need:['卵','玉ねぎ'],time:12,easy:true,vegetarian:false,extra:'ごはん・めんつゆ',note:'卵のやさしい味で、ほっとする一杯'},
 {name:'キャベツとツナの蒸し煮',emoji:'🥬',need:['キャベツ','ツナ'],time:10,easy:true,vegetarian:false,extra:'塩・こしょう',note:'フライパンひとつで、あと片付けも楽'},
 {name:'具だくさん野菜スープ',emoji:'🍲',need:['にんじん','玉ねぎ'],time:20,easy:true,vegetarian:true,extra:'コンソメ',note:'冷蔵庫の野菜をまとめておいしく'},
 {name:'トマトと卵の炒めもの',emoji:'🍅',need:['トマト','卵'],time:8,easy:true,vegetarian:true,extra:'ごま油・塩',note:'さっと炒めて、とろっと仕上げる'},
 {name:'鶏むね肉の照り焼き',emoji:'🍗',need:['鶏むね肉'],time:15,easy:false,vegetarian:false,extra:'しょうゆ・みりん',note:'甘辛だれがごはんにぴったり'},
 {name:'きのこのバター醤油パスタ',emoji:'🍝',need:['きのこ'],time:15,easy:true,vegetarian:true,extra:'パスタ・バター',note:'香ばしいバター醤油の定番'},
 {name:'じゃがいものガレット',emoji:'🥔',need:['じゃがいも'],time:15,easy:false,vegetarian:true,extra:'チーズ・塩',note:'外はカリッ、中はほくほく'},
 {name:'豆腐とわかめのお味噌汁',emoji:'🥣',need:['豆腐'],time:10,easy:true,vegetarian:true,extra:'わかめ・味噌',note:'いつもの食卓にうれしい一品'}
];
const STORAGE_KEY='kyou-no-reizouko-ingredients-v1';
let items=[];try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');if(Array.isArray(saved))items=saved.filter(x=>typeof x==='string')}catch{}
let kind='fridge',filter='all',imageUrl='';const $=s=>document.querySelector(s);
const cloudConfig=window.SUPABASE_CONFIG||{};let cloudClient=null,cloudUser=null,cloudTimer=null;
if(window.supabase?.createClient&&cloudConfig.url&&cloudConfig.anonKey)cloudClient=window.supabase.createClient(cloudConfig.url,cloudConfig.anonKey);
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function render(){localStorage.setItem(STORAGE_KEY,JSON.stringify(items));if(cloudUser){clearTimeout(cloudTimer);cloudTimer=setTimeout(saveCloud,500)}const box=$('#ingredients');box.innerHTML='';items.forEach((x,i)=>{const c=document.createElement('span');c.className='chip';c.append(document.createTextNode(x+' '));const b=document.createElement('button');b.textContent='×';b.setAttribute('aria-label',x+'を削除');b.onclick=()=>{items.splice(i,1);render()};c.append(b);box.append(c)});$('#count').textContent=items.length+' 品';$('#empty').hidden=items.length>0;$('#demoNote').hidden=!window.demoItems;let matching=recipes.map(r=>({...r,score:r.need.filter(n=>items.includes(n)).length})).filter(r=>r.score>0).sort((a,b)=>b.score-a.score);if(filter==='15')matching=matching.filter(r=>r.time<=15);if(filter==='easy')matching=matching.filter(r=>r.easy);if(filter==='vegetarian')matching=matching.filter(r=>r.vegetarian);$('#recipes').innerHTML='';matching.forEach(r=>{const a=document.createElement('article');a.className='recipe';a.innerHTML=`<div class="food">${r.emoji}</div><div><h3>${r.name}</h3><p>${r.note}<br>あと ${r.extra}</p><div class="meta">◷ ${r.time}分 <span>·</span> ${r.easy?'かんたん':'ふつう'}<span class="match">食材 ${r.score}/${r.need.length}</span></div></div>`;$('#recipes').append(a)});$('#recipeCount').textContent=items.length?matching.length+' 件':'まずは食材を追加';$('#noRecipes').style.display=items.length>0&&matching.length===0?'block':'none';if(items.length<2&&matching.length===0)$('#noRecipes').style.display='block'}
function add(list){let added=0;list.map(x=>x.trim()).filter(Boolean).forEach(x=>{if(!items.some(v=>v.toLowerCase()===x.toLowerCase())){items.push(x);added++}});render();return added}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');kind=b.dataset.kind;$('#uploadHint').textContent=kind==='fridge'?'冷蔵庫の中が見える写真をアップロード':'買った食材が写ったレシートをアップロード';$('#uploadTitle').textContent=kind==='fridge'?'写真を撮る・選ぶ':'レシートを撮る・選ぶ';$('#scan').innerHTML=(kind==='fridge'?'写真':'レシート')+'から食材を読み取る <span>→</span>';$('#photo').value=''});
$('#photo').onchange=e=>{const f=e.target.files[0];if(!f)return;if(imageUrl)URL.revokeObjectURL(imageUrl);imageUrl=URL.createObjectURL(f);$('#preview').src=imageUrl;$('#drop').classList.add('has-image');$('#uploadTitle').textContent=f.name};
$('#scan').onclick=()=>{if(!$('#photo').files[0]){toast('先に写真を撮るか、画像を選んでください');$('#photo').click();return}const btn=$('#scan');btn.disabled=true;btn.textContent='写真を確認しています…';setTimeout(()=>{btn.disabled=false;btn.innerHTML='写真から食材を読み取る <span>→</span>';window.demoItems=true;const demo=kind==='fridge'?['卵','キャベツ','トマト','玉ねぎ']:['卵','鶏むね肉','にんじん'];const n=add(demo);toast('食材候補を追加しました。内容を確認してください');},850)};
$('#manual').onsubmit=e=>{e.preventDefault();const val=$('#ingredientInput').value;if(!val.trim())return;const n=add(val.split(/[、,，\s]+/));$('#ingredientInput').value='';window.demoItems=false;toast(n?'食材を追加しました':'すでに追加されています')};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=b.dataset.filter;render()});document.querySelectorAll('.nav').forEach((b,i)=>b.onclick=()=>{if(i)toast('この機能は準備中です')});render();
function setCloudStatus(title,subtitle,button){$('#cloudTitle').textContent=title;$('#cloudSubtitle').textContent=subtitle;$('#cloudToggle').textContent=button}
function showCloudHelp(message){const el=$('#cloudHelp');el.textContent=message;el.classList.add('show')}
async function syncCloud(){if(!cloudClient||!cloudUser)return;setCloudStatus('クラウドと同期中…',cloudUser.email||'ログイン済み','同期中');const {data,error}=await cloudClient.from('fridge_lists').select('ingredients').eq('user_id',cloudUser.id).maybeSingle();if(error){showCloudHelp('同期に失敗しました。Supabaseの接続設定とテーブル設定を確認してください。');setCloudStatus('端末に保存中','クラウドに接続できません','再試行');return}if(data&&Array.isArray(data.ingredients)){items=data.ingredients.filter(x=>typeof x==='string');render()}else await saveCloud();setCloudStatus('スマホ・PCで同期中',cloudUser.email||'ログイン済み','ログアウト')}
async function saveCloud(){if(!cloudClient||!cloudUser)return;setCloudStatus('クラウドに保存中…',cloudUser.email||'ログイン済み','同期中');const {error}=await cloudClient.from('fridge_lists').upsert({user_id:cloudUser.id,ingredients:items,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error){showCloudHelp('クラウドへの保存に失敗しました。ネット接続とテーブル設定を確認してください。');setCloudStatus('端末に保存中','クラウドに接続できません','再試行');return}setCloudStatus('スマホ・PCで同期中',cloudUser.email||'ログイン済み','ログアウト')}
$('#cloudToggle').onclick=async()=>{if(!cloudClient){showCloudHelp('クラウド接続の準備がまだです。付属の「はじめかた.md」に沿ってSupabaseのURLと公開キーを設定してください。');return}if(cloudUser){await cloudClient.auth.signOut();cloudUser=null;setCloudStatus('端末間で食材を同期','メールでログインすると、スマホとPCで共有できます','ログイン');$('#cloudForm').classList.remove('open');return}$('#cloudForm').classList.toggle('open')};
$('#cloudForm').onsubmit=async e=>{e.preventDefault();if(!cloudClient){showCloudHelp('先にSupabaseの接続設定が必要です。付属の「はじめかた.md」をご覧ください。');return}const email=$('#cloudEmail').value.trim();const {error}=await cloudClient.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});if(error){showCloudHelp('ログインメールを送れませんでした。設定とメールアドレスを確認してください。');return}showCloudHelp('ログイン用リンクをメールで送りました。リンクを開くと、この端末と他の端末で食材リストを同期します。');$('#cloudForm').classList.remove('open')};
if(cloudClient){cloudClient.auth.getSession().then(({data})=>{cloudUser=data.session?.user||null;if(cloudUser)syncCloud()});cloudClient.auth.onAuthStateChange((_event,session)=>{cloudUser=session?.user||null;if(cloudUser)syncCloud();else setCloudStatus('端末間で食材を同期','メールでログインすると、スマホとPCで共有できます','ログイン')});window.addEventListener('focus',()=>{if(cloudUser)syncCloud()});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudUser)syncCloud()})}else setCloudStatus('端末間で食材を同期','接続設定後、スマホとPCで共有できます','設定方法');
</script></body></html>
